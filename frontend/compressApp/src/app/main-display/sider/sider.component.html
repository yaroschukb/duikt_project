<div [hidden]="files.length <= 0">
  <h3>Your Compressed photo</h3>
  <div class="scrollable">
    <div *ngFor="let file of updatedFiles">
      <img
        nz-image
        width="100px"
        height="100px"
        nzSrc="{{ file.blobUrl }}"
        alt="{{ file.filename }}"
      />
    </div>
  </div>
</div>
